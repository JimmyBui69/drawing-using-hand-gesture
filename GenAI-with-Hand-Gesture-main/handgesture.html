<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Gesture Gift Opening</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<style>
body{
  margin:0;
  background:black;
  color:white;
  font-family:Arial;
  overflow:hidden;
}
#hint{
  position:absolute;
  top:10px;
  width:100%;
  text-align:center;
  font-size:20px;
  z-index:10;
}
canvas{position:absolute;top:0;left:0;}
video{display:none;}
</style>
</head>

<body>

<div id="hint">
🖐 OPEN – 🤏 PINCH – ✊ FIST – ✌️ PEACE để mở quà 🎁
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
<audio id="bgm" src="magic.mp3" loop></audio>

<script>
/* ===== SETUP ===== */
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;
canvas.height=innerHeight;

const video=document.getElementById("video");
const bgm=document.getElementById("bgm");
bgm.volume=0.6;

document.body.addEventListener("click",()=>{
  bgm.play().catch(()=>{});
});

/* ===== CAMERA ===== */
const camera=new Camera(video,{
  onFrame:async()=>{ await hands.send({image:video}); },
  width:640,height:480
});
camera.start();

/* ===== PARTICLES ===== */
let particles=[];
function spawnParticles(x,y,n=60){
  for(let i=0;i<n;i++){
    particles.push({
      x,y,
      vx:(Math.random()-0.5)*5,
      vy:(Math.random()-1)*5,
      life:80
    });
  }
}
function drawParticles(){
  particles.forEach(p=>{
    ctx.fillStyle="rgba(255,255,200,0.8)";
    ctx.beginPath();
    ctx.arc(p.x,p.y,3,0,Math.PI*2);
    ctx.fill();
    p.x+=p.vx;
    p.y+=p.vy;
    p.life--;
  });
  particles=particles.filter(p=>p.life>0);
}

/* ===== BAG ===== */
function drawBag(){
  ctx.save();
  ctx.translate(canvas.width/2, canvas.height*0.7);
  ctx.fillStyle="#b22222";
  ctx.beginPath();
  ctx.ellipse(0,0,180,200,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#8b0000";
  ctx.fillRect(-160,-200,320,40);

  ctx.strokeStyle="#ffd700";
  ctx.lineWidth=6;
  ctx.beginPath();
  ctx.arc(0,-185,120,0,Math.PI);
  ctx.stroke();
  ctx.restore();
}

/* ===== GIFTS ===== */
let currentGift=0;
function drawGift(){
  if(currentGift===0) return;

  ctx.textAlign="center";
  ctx.shadowColor="gold";
  ctx.shadowBlur=20;

  if(currentGift===1){
    ctx.font="48px Arial";
    ctx.fillStyle="pink";
    ctx.fillText("❤️ I LOVE YOU ❤️",canvas.width/2,canvas.height/2);
  }
  if(currentGift===2){
    ctx.font="42px Arial";
    ctx.fillStyle="lightgreen";
    ctx.fillText("🎄 Giáng sinh an lành 🎄",canvas.width/2,canvas.height/2);
  }
  if(currentGift===3){
    ctx.font="40px Arial";
    ctx.fillStyle="white";
    ctx.fillText("✨ MAGIC PARTICLE ✨",canvas.width/2,canvas.height/2);
    spawnParticles(canvas.width/2,canvas.height/2,15);
  }
  if(currentGift===4){
    ctx.font="42px Arial";
    ctx.fillStyle="cyan";
    ctx.fillText("🎆 HAPPY NEW YEAR 🎆",canvas.width/2,canvas.height/2);
  }
  ctx.shadowBlur=0;
}

/* ===== CAMERA PREVIEW ===== */
function drawCamera(){
  ctx.drawImage(video,canvas.width-180,20,160,120);
  ctx.strokeStyle="white";
  ctx.strokeRect(canvas.width-180,20,160,120);
}

/* ===== GESTURE AI ===== */
const hands=new Hands({
  locateFile:file=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});
hands.setOptions({
  maxNumHands:1,
  modelComplexity:1,
  minDetectionConfidence:0.6,
  minTrackingConfidence:0.6
});

function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }

let lastGesture="";
let holdStart=0;

function detectGesture(lm){
  const WRIST=0, THUMB=4, INDEX=8, MIDDLE=12, RING=16, PINKY=20;

  let open=(dist(lm[INDEX],lm[WRIST])+
            dist(lm[MIDDLE],lm[WRIST])+
            dist(lm[RING],lm[WRIST])+
            dist(lm[PINKY],lm[WRIST]))/4;

  const pinch=dist(lm[THUMB],lm[INDEX]);

  const indexUp=lm[INDEX].y<lm[6].y;
  const middleUp=lm[MIDDLE].y<lm[10].y;
  const ringDown=lm[RING].y>lm[14].y;
  const pinkyDown=lm[PINKY].y>lm[18].y;

  if(open<0.22) return "FIST";
  if(pinch<0.05) return "PINCH";
  if(indexUp&&middleUp&&ringDown&&pinkyDown) return "PEACE";
  return "OPEN";
}

hands.onResults(res=>{
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawBag();
  drawParticles();
  drawGift();
  drawCamera();

  if(res.multiHandLandmarks.length){
    const g=detectGesture(res.multiHandLandmarks[0]);
    if(g===lastGesture){
      if(Date.now()-holdStart>1200){
        if(g==="OPEN") currentGift=1;
        if(g==="PINCH") currentGift=2;
        if(g==="FIST") currentGift=3;
        if(g==="PEACE") currentGift=4;
        spawnParticles(canvas.width/2,canvas.height/2,120);
        holdStart=Date.now()+9999;
      }
    } else {
      lastGesture=g;
      holdStart=Date.now();
    }
  }
});
</script>

</body>
</html>
